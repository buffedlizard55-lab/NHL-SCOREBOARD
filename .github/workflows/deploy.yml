# Refreshes the official NHL data snapshot and publishes it.
#
# GitHub Pages for this repo serves the main branch directly (see .nojekyll),
# so "deploying" = committing fresh data files to main. Every commit here
# triggers a Pages rebuild automatically.
#
# Runs:
#   - every 5 minutes (keeps live scores/play-by-play current)
#   - manually from the Actions tab (workflow_dispatch)
#   - on pushes to main that change site code (keeps the badge honest);
#     data/ commits do NOT retrigger this workflow (paths filter below),
#     so there is no feedback loop.
#
# The NHL API (api-web.nhle.com) sends no CORS headers, so browsers cannot
# read it from a static site. This workflow fetches the data server-side,
# straight from the NHL's official endpoints — first-party data only.
name: Refresh official NHL data

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'styles.css'
      - '.nojekyll'
      - 'tools/**'
      - '.github/workflows/deploy.yml'
  schedule:
    # GitHub cron: minimum granularity is 5 minutes. Times are UTC.
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: nhl-data-snapshot
  # Queue instead of cancel: the first run after adding the season/archive
  # snapshot phases backfills ~200 historical dates (capped at 60 per run and
  # fully resumable) and must never be killed mid-run by the next cron tick.
  # Runs still execute serially, so nothing piles up.
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch fresh official NHL data
        # Exits non-zero when the core scoreboard cannot be fetched;
        # in that case nothing is committed and the previous snapshot stays live.
        run: node tools/build-site.mjs

      - name: Publish if the data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Official data unchanged; nothing to publish."
            exit 0
          fi
          git commit -m "chore(data): refresh official NHL snapshot"
          for i in 1 2 3; do
            git push origin HEAD:main && break
            echo "Push rejected; rebasing onto latest main and retrying ($i/3)..."
            git pull --rebase origin main
            sleep $(( (RANDOM % 5) + 2 ))
          done
